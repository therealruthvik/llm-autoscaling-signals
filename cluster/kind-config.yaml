# Single-node kind cluster. NodePort 30080 is mapped to localhost:8080 so the
# load generator on the Mac hits the Service, and kube-proxy spreads requests
# across all emulator pods (kubectl port-forward would pin one pod).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: autoscale
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
      - containerPort: 30090
        hostPort: 9090

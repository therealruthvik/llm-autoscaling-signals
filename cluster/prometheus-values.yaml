# Minimal Prometheus: server + kube-state-metrics (for replica counts).
# Scrape interval is an RQ3 variable; 15s is the baseline.
server:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: false
  service:
    type: NodePort
    nodePort: 30090
  retention: 2d
# The load generator on the host serves gateway_requests_total (ingress policy).
extraScrapeConfigs: |
  - job_name: gateway
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:9400']
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: true

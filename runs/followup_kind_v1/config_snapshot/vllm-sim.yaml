# vLLM emulator (llm-d-inference-sim) standing in for one GPU replica.
# Calibrated from the three T4 profiling runs (data/results_run{1,2,3}, Qwen2.5-1.5B,
# vLLM 0.32.0); see analysis/calibrate_emulator.py for the fit.
#   time-to-first-token    90ms   TTFT p50 at 1 rps, 76-95 ms across runs
#   ttft std-dev           27ms   emulator caps jitter at 30% of mean
#   inter-token-latency    17.5ms TPOT p50 at 1 rps, 17.5-17.9 ms
#   time-factor-under-load 12     emulator scales TTFT and ITL linearly in running/limit;
#                                 13 = least-squares fit of TPOT vs batch, but gave 7.0 req/s
#                                 saturated capacity vs 7.85 measured (runs/emuval_v1), so 12
#                                 (capacity ~ 0.963*256/(ITL*f)/150 tokens per request)
#   max-num-seqs           256    running requests capped at 256 in all runs
#   kv-cache-size          15600  emulator counts prompt blocks only, so its KV usage read
#                                 0.77x the T4 value at 8-16 rps with the true capacity
#                                 (20294 blocks = 324704 tokens); capacity scaled by 0.77 so the
#                                 KV signal level matches the measured curve
#   startup-duration       73s    median warm cold start (65.8-100.0 s, 6 trials)
#   max-waiting-queue-length 100000  emulator default 1000 returns HTTP 429 when full;
#                                 vLLM's waiting queue is unbounded (runs/emuval_v1, 32 rps)
# Emulator values approximate measured behavior; they are not measurements.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
  namespace: llm
  labels:
    app: vllm-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-sim
  template:
    metadata:
      labels:
        app: vllm-sim
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Graceful scale-down: the pod leaves the Service endpoints first, then
      # preStop waits so in-flight requests finish before SIGTERM.
      terminationGracePeriodSeconds: 150
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
          args:
            - --model=Qwen/Qwen2.5-1.5B-Instruct
            - --port=8000
            - --mode=random
            - --max-num-seqs=256
            - --max-waiting-queue-length=100000
            - --max-model-len=2048
            - --latency-calculator=constant
            - --time-to-first-token=90ms
            - --time-to-first-token-std-dev=27ms
            - --inter-token-latency=17500us
            - --time-factor-under-load=12
            - --enable-kvcache=true
            - --block-size=16
            - --kv-cache-size=15600
            - --startup-duration=STARTUP_DURATION
          env:
            # Required by the emulator when --enable-kvcache is set.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 120
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-sim
  namespace: llm
spec:
  type: NodePort
  selector:
    app: vllm-sim
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080

# Offered load: requests/s arriving at the gateway, target 6.4 per replica = 80% of measured T4 capacity.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-sim-ingress
  namespace: llm
spec:
  scaleTargetRef:
    name: vllm-sim
  minReplicaCount: 1
  maxReplicaCount: MAX_REPLICAS
  pollingInterval: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: STABILIZATION
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        query: sum(rate(gateway_requests_total{job="gateway"}[1m]))
        threshold: "6.4"

# Batch size as in running, with a static floor of 2 replicas (minReplicaCount 2).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-sim-running-floor2
  namespace: llm
spec:
  scaleTargetRef:
    name: vllm-sim
  minReplicaCount: 2
  maxReplicaCount: MAX_REPLICAS
  pollingInterval: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: STABILIZATION
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        query: sum(vllm:num_requests_running{namespace="llm"})
        threshold: "50"
